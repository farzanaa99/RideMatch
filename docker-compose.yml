services:
  db:
    image: postgres:16-alpine
    container_name: ridematch-db
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: ridematch
      POSTGRES_PASSWORD: ridematch
      POSTGRES_DB: ridematch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridematch -d ridematch"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ridematch-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ridematch-api
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      DATABASE_URL: postgresql+asyncpg://ridematch:ridematch@db:5432/ridematch
      REDIS_URL: redis://redis:6379/0
      SQL_ECHO: "False"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ridematch-worker
    command: python -m app.workers.redis_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://ridematch:ridematch@db:5432/ridematch
      REDIS_URL: redis://redis:6379/0
      SQL_ECHO: "False"
      LOG_LEVEL: INFO
      WORKER_POLL_SECONDS: "2"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data: